name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Determine version
        id: version
        shell: bash
        env:
          # Passed via env, not pasted into the script, so the input can't inject shell commands
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_VERSION"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version '$TAG' must look like v1.2.3 or v1.2.3-beta.1"; exit 1
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "nuget_version=${TAG#v}" >> $GITHUB_OUTPUT
          # Tags with a suffix (v1.4.0-beta.1) are published as pre-releases, which the
          # in-app updater ignores (it reads /releases/latest)
          if [[ "$TAG" == *-* ]]; then echo "prerelease=true" >> $GITHUB_OUTPUT; else echo "prerelease=false" >> $GITHUB_OUTPUT; fi

      - name: Publish (self-contained, win-x64)
        run: |
          dotnet publish src/RTMPProjector.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:Version=${{ steps.version.outputs.nuget_version }} `
            -o publish/

      - name: Ensure VLC native libs in publish output
        shell: pwsh
        run: |
          $dest       = "publish\libvlc\win-x64"
          $pluginsDir = "$dest\plugins"
          # -Recurse so plugins in subdirectories (access\, codec\, etc.) are counted
          $pluginCount = if (Test-Path $pluginsDir) { (Get-ChildItem $pluginsDir -Recurse -Filter "*.dll").Count } else { 0 }
          $hasLibvlc  = Test-Path "$dest\libvlc.dll"

          Write-Host "Pre-check — libvlc.dll: $hasLibvlc  plugins (recursive): $pluginCount DLLs"

          if ($hasLibvlc -and $pluginCount -gt 0) {
            Write-Host "VLC verified — skipping NuGet cache copy"
          } else {
            Write-Warning "VLC incomplete (libvlc=$hasLibvlc plugins=$pluginCount) — locating source"
            $vlcSrc = $null

            # ── Strategy 1: MSBuild wrote the package root path to a hint file ─────
            $hintFile = "publish\vlc-pkg-root.txt"
            if (Test-Path $hintFile) {
              $pkgRoot = (Get-Content $hintFile -Raw).Trim()
              Write-Host "MSBuild hint pkg root: $pkgRoot"
              if (Test-Path $pkgRoot) {
                Write-Host "`nVideoLAN.LibVLC.Windows package tree (from hint):"
                Get-ChildItem $pkgRoot -Recurse -ErrorAction SilentlyContinue |
                  ForEach-Object { Write-Host "  $($_.FullName.Substring($pkgRoot.Length))" }
                $dll = Get-ChildItem $pkgRoot -Recurse -Filter "libvlc.dll" `
                         -ErrorAction SilentlyContinue |
                       Where-Object { $_.FullName -notmatch "\\x86\\" } |
                       Select-Object -First 1
                if ($dll) {
                  Write-Host "Found via hint: $($dll.FullName)"
                  $vlcSrc = $dll.DirectoryName
                }
              }
            }

            # ── Strategy 2: dotnet nuget locals + recursive search ────────────────
            if (-not $vlcSrc) {
              $lines    = (& dotnet nuget locals global-packages -l 2>&1) -join "`n"
              Write-Host "dotnet nuget locals: $lines"
              $nugetRoot = $null
              if ($lines -match "global-packages:\s*(.+)") { $nugetRoot = $Matches[1].Trim() }
              Write-Host "NuGet root: '$nugetRoot'"

              if ($nugetRoot -and (Test-Path $nugetRoot)) {
                # Case-insensitive glob — package dir may be lowercased
                $pkgDir = Get-ChildItem $nugetRoot -Filter "videolan.libvlc.windows" `
                            -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($pkgDir) {
                  Write-Host "`nVideoLAN.LibVLC.Windows package tree (from NuGet):"
                  Get-ChildItem $pkgDir.FullName -Recurse -ErrorAction SilentlyContinue |
                    ForEach-Object { Write-Host "  $($_.FullName.Substring($pkgDir.FullName.Length))" }
                  $dll = Get-ChildItem $pkgDir.FullName -Recurse -Filter "libvlc.dll" `
                           -ErrorAction SilentlyContinue |
                         Where-Object { $_.FullName -notmatch "\\x86\\" } |
                         Select-Object -First 1
                  if ($dll) {
                    Write-Host "Found via NuGet cache: $($dll.FullName)"
                    $vlcSrc = $dll.DirectoryName
                  } else {
                    Write-Host "libvlc.dll not found in package tree — tree dumped above"
                  }
                } else {
                  Write-Host "videolan.libvlc.windows dir not found under: $nugetRoot"
                  Write-Host "Packages present: $(Get-ChildItem $nugetRoot | Select-Object -ExpandProperty Name)"
                }
              }
            }

            # ── Strategy 3: broad search of entire NuGet cache root ───────────────
            if (-not $vlcSrc) {
              Write-Host "Falling back to broad NuGet cache search..."
              $lines    = (& dotnet nuget locals global-packages -l 2>&1) -join "`n"
              if ($lines -match "global-packages:\s*(.+)") {
                $nugetRoot = $Matches[1].Trim()
                $dll = Get-ChildItem $nugetRoot -Recurse -Filter "libvlc.dll" `
                         -ErrorAction SilentlyContinue |
                       Where-Object { $_.FullName -notmatch "\\x86\\" } |
                       Select-Object -First 1
                if ($dll) {
                  Write-Host "Found via broad search: $($dll.FullName)"
                  $vlcSrc = $dll.DirectoryName
                }
              }
            }

            if (-not $vlcSrc) {
              Write-Error "Could not locate VLC native libs after all strategies. Review tree dumps above."
              exit 1
            }

            Write-Host "Copying VLC from: $vlcSrc"
            New-Item -ItemType Directory -Force $dest | Out-Null
            # Use robocopy instead of Copy-Item: the wildcard+recurse form of Copy-Item
            # has a known PowerShell bug where it creates subdirs but skips their contents.
            # Robocopy /E copies the full tree reliably; exit codes 0-7 all mean success.
            $rc = (robocopy $vlcSrc $dest /E /IS /IT /NP /NFL /NDL /NJH /NJS)
            if ($LASTEXITCODE -gt 7) { Write-Error "robocopy failed ($LASTEXITCODE)"; exit 1 }
          }

          # Clean up the hint file — not part of the app
          Remove-Item "publish\vlc-pkg-root.txt" -ErrorAction SilentlyContinue

          # Always print final tree so CI logs show exactly what goes into the zip
          Write-Host "`nlibvlc\win-x64 tree:"
          Get-ChildItem $dest -Recurse | ForEach-Object {
            $rel = $_.FullName.Substring((Resolve-Path $dest).Path.Length + 1)
            Write-Host "  $rel"
          }

      - name: Bundle VC++ runtime DLLs with VLC
        shell: pwsh
        run: |
          # VLC's native DLLs are compiled with MSVC and require the VC++ runtime.
          # Use vswhere to locate VS, then copy from the Redist folder (licensed
          # for redistribution) so users don't need the VC++ Redistributable.
          $dest = "publish\libvlc\win-x64"
          $needed = @("vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll")

          # Locate VS installation via vswhere
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot = & $vswhere -latest -property installationPath 2>$null
          $redistRoot = if ($vsRoot) { Join-Path $vsRoot "VC\Redist\MSVC" } else { $null }

          $missing = @()
          foreach ($dll in $needed) {
            if (Test-Path "$dest\$dll") {
              Write-Host "$dll already present — skipping"; continue
            }
            # Try Redist folder first (most reliable), then fall back to a broader search
            $src = $null
            if ($redistRoot -and (Test-Path $redistRoot)) {
              $src = Get-ChildItem $redistRoot -Recurse -Filter $dll -ErrorAction SilentlyContinue |
                     Where-Object { $_.FullName -match "\\x64\\" } |
                     Select-Object -First 1
            }
            if (-not $src) {
              $src = Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio" `
                       -Recurse -Filter $dll -ErrorAction SilentlyContinue |
                     Where-Object { $_.FullName -match "\\x64\\" } |
                     Select-Object -First 1
            }
            if ($src) {
              Copy-Item $src.FullName "$dest\$dll" -Force
              Write-Host "Bundled $dll from $($src.FullName)"
            } else {
              $missing += $dll
            }
          }
          # Without these, video playback fails on PCs that lack the VC++ Redistributable —
          # better to fail the build than ship a broken installer
          if ($missing.Count -gt 0) { Write-Error "VC++ runtime DLLs not found: $($missing -join ', ')"; exit 1 }
          Write-Host "libvlc\win-x64 contents:"; Get-ChildItem $dest | Select-Object -ExpandProperty Name

      - name: Bundle MediaMTX binary
        shell: pwsh
        run: |
          $dest = "publish\mediamtx.exe"

          Write-Host "Fetching latest MediaMTX release info..."
          $headers = @{ "User-Agent" = "RTMPProjector-CI"; "Accept" = "application/json" }
          $rel  = Invoke-RestMethod "https://api.github.com/repos/bluenviron/mediamtx/releases/latest" -Headers $headers
          $asset = $rel.assets | Where-Object {
            $_.name -match "windows_amd64" -and $_.name -match "\.zip$"
          } | Select-Object -First 1
          if (-not $asset) { Write-Error "No windows_amd64 zip found in MediaMTX release"; exit 1 }

          Write-Host "Downloading $($asset.name) ($([math]::Round($asset.size/1MB, 1)) MB)..."
          $zip = Join-Path $env:TEMP "mediamtx.zip"
          Invoke-WebRequest $asset.browser_download_url -OutFile $zip -Headers $headers

          # GitHub publishes a SHA-256 "digest" for release assets — refuse a mismatch
          if ($asset.digest -match '^sha256:([0-9a-fA-F]{64})$') {
            $actual = (Get-FileHash $zip -Algorithm SHA256).Hash
            if ($actual -ne $Matches[1]) { Write-Error "MediaMTX checksum mismatch"; exit 1 }
            Write-Host "MediaMTX checksum verified"
          } else {
            Write-Warning "MediaMTX release has no published digest — size only: $($asset.size)"
            if ((Get-Item $zip).Length -ne $asset.size) { Write-Error "MediaMTX size mismatch"; exit 1 }
          }

          Write-Host "Extracting mediamtx.exe..."
          $tmp = Join-Path $env:TEMP "mediamtx_extract"
          if (Test-Path $tmp) { Remove-Item $tmp -Recurse -Force }
          Expand-Archive $zip $tmp
          $exe = Get-ChildItem $tmp -Recurse -Filter "mediamtx.exe" | Select-Object -First 1
          if (-not $exe) { Write-Error "mediamtx.exe not found in zip"; exit 1 }
          Copy-Item $exe.FullName $dest
          Remove-Item $tmp -Recurse -Force
          Remove-Item $zip -Force
          Write-Host "Bundled mediamtx.exe ($([math]::Round((Get-Item $dest).Length/1MB,1)) MB)"

      - name: Bundle FFmpeg binary (Go Live)
        shell: pwsh
        run: |
          $dest = "publish\ffmpeg.exe"

          # gyan.dev release build first, BtbN nightly as a fallback. Both contain <dir>\bin\ffmpeg.exe
          $urls = @(
            "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip",
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          )
          $zip = Join-Path $env:TEMP "ffmpeg.zip"
          $tmp = Join-Path $env:TEMP "ffmpeg_extract"
          foreach ($url in $urls) {
            try {
              Write-Host "Downloading $url ..."
              Invoke-WebRequest $url -OutFile $zip -Headers @{ "User-Agent" = "RTMPProjector-CI" }
              # Verify against the publisher's checksum (gyan: <zip>.sha256, BtbN: checksums.sha256)
              # Download the checksum file to disk (.Content can come back as bytes for octet-stream)
              $sumFile = Join-Path $env:TEMP "ffmpeg.sha256"
              if ($url -match 'gyan\.dev') {
                Invoke-WebRequest "$url.sha256" -OutFile $sumFile -Headers @{ "User-Agent" = "RTMPProjector-CI" }
                $expected = ((Get-Content $sumFile -Raw).Trim() -split '\s+')[0]
              } else {
                $name = Split-Path $url -Leaf
                Invoke-WebRequest ($url.Substring(0, $url.LastIndexOf('/') + 1) + "checksums.sha256") -OutFile $sumFile -Headers @{ "User-Agent" = "RTMPProjector-CI" }
                $line = Get-Content $sumFile | Where-Object { $_ -match ([regex]::Escape($name) + '\s*$') } | Select-Object -First 1
                $expected = if ($line) { ($line.Trim() -split '\s+')[0] } else { $null }
              }
              if (-not $expected) { throw "no published checksum" }
              if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $expected.ToUpper()) { throw "checksum mismatch" }
              Write-Host "FFmpeg checksum verified"
              if (Test-Path $tmp) { Remove-Item $tmp -Recurse -Force }
              Expand-Archive $zip $tmp
              $exe = Get-ChildItem $tmp -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
              if (-not $exe) { throw "ffmpeg.exe not found in zip" }
              Copy-Item $exe.FullName $dest
              # FFmpeg is GPL — ship its licence alongside the binary
              $lic = Get-ChildItem $tmp -Recurse -Include "LICENSE*", "COPYING*" | Select-Object -First 1
              if ($lic) { Copy-Item $lic.FullName "publish\ffmpeg-LICENSE.txt" }
              break
            } catch {
              Write-Warning "FFmpeg from $url failed: $_"
            } finally {
              Remove-Item $zip -Force -ErrorAction SilentlyContinue
              Remove-Item $tmp -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          if (-not (Test-Path $dest)) { Write-Error "Could not bundle ffmpeg.exe"; exit 1 }
          Write-Host "Bundled ffmpeg.exe ($([math]::Round((Get-Item $dest).Length/1MB,1)) MB)"

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "Inno Setup not found — installing via choco..."
            choco install innosetup --no-progress -y | Out-Null
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          Write-Host "ISCC: $iscc"
          & $iscc `
            "/DAppVersion=${{ steps.version.outputs.nuget_version }}" `
            "installer\RTMPProjector.iss"
          if ($LASTEXITCODE -ne 0) { Write-Error "ISCC failed ($LASTEXITCODE)"; exit 1 }
          # ISCC writes to the OutputDir in the .iss (installer\), rename to include tag
          $src = "installer\RTMPProjector-${{ steps.version.outputs.nuget_version }}-Setup.exe"
          $dst = "RTMPProjector-${{ steps.version.outputs.tag }}-Setup.exe"
          Move-Item $src $dst
          Write-Host "Installer: $dst  ($('{0:F1}' -f ((Get-Item $dst).Length / 1MB)) MB)"

      - name: Zip release
        shell: pwsh
        run: |
          Compress-Archive -Path publish\* -DestinationPath RTMPProjector-${{ steps.version.outputs.tag }}-win-x64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: RTMP Projector ${{ steps.version.outputs.tag }}
          # Created as a draft and published below only once every file has uploaded —
          # otherwise the in-app updater can see a release with no installer yet
          draft: true
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
          files: |
            RTMPProjector-${{ steps.version.outputs.tag }}-Setup.exe
            RTMPProjector-${{ steps.version.outputs.tag }}-win-x64.zip
          body: |
            ## RTMP Projector ${{ steps.version.outputs.tag }}

            ### Installation
            **Recommended:** Download `RTMPProjector-*-Setup.exe` — runs the installer, lets you pick the install folder, adds a Start Menu shortcut, and registers an uninstaller.

            **Portable:** Download the zip, extract it anywhere, and run `RTMPProjector.exe`.

            MediaMTX and FFmpeg are bundled — no separate downloads needed.

            ### Requirements
            - Windows 10 / 11 x64
            - No separate .NET install needed (self-contained)

            See the [README](https://github.com/${{ github.repository }}/blob/main/README.md) for full setup instructions.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
